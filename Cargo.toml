[package]
name = "tree-sitter-dbt"
description = "dbt models and macros: Jinja over SQL"
version = "0.1.0"
authors = ["sirh3e"]
license = "MIT"
readme = "README.md"
keywords = ["tree-sitter", "dbt", "jinja", "sql", "parser"]
categories = ["parser-implementations", "parsing", "text-editors"]
repository = "https://github.com/sirh3e/tree-sitter-dbt"
edition = "2021"
autoexamples = false

build = "bindings/rust/build.rs"
include = [
  "bindings/rust/*",
  "grammar.js",
  "queries/*",
  "src/*",
  "tree-sitter.json",
  "/LICENSE",
]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1.2"

[dev-dependencies]
tree-sitter = "0.26.8"
